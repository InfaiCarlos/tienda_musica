<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MelodyHouse - Tienda de Música{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar-custom { background-color: #1e293b; border-bottom: 2px solid #3b82f6; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #f8fafc; }
        .btn-primary-custom { background-color: #3b82f6; border: none; font-weight: 600; }
        .btn-primary-custom:hover { background-color: #2563eb; }
        .footer { margin-top: auto; background-color: #0f172a; border-top: 1px solid #334155; }
    </style>
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary fs-3" href="{% url 'listar_instrumentos' %}">
                <i class="fa-solid fa-guitar me-2"></i>MelodyHouse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-light me-3" href="{% url 'listar_instrumentos' %}">
                            <i class="fa-solid fa-list me-1"></i> Ver Catálogo
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary-custom px-4 py-2 text-white rounded-pill" href="{% url 'crear_instrumento' %}">
                            <i class="fa-solid fa-plus me-1"></i> Agregar Instrumento
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Mensajes Flotantes -->
    <div class="container mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show card-custom" role="alert">
                    <i class="fa-solid fa-circle-check me-2 text-success"></i>{{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Contenido Principal -->
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer py-3 text-center text-muted">
        <div class="container">
            <small>© 2026 MelodyHouse - Proyecto Django Backend | Evaluación Sumativa 02</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
